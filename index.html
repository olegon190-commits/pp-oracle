<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ПП Оракул</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#F3EEE4; --text:#1E2A22; --hint:#6E776B;
  --glass:rgba(255,255,255,.58); --glass-2:rgba(255,255,255,.30); --glass-border:rgba(255,255,255,.8); --glass-hl:rgba(255,255,255,.95);
  --fill:rgba(30,42,34,.055); --line:rgba(30,42,34,.08); --seg-on:#fff;
  --sheet:rgba(247,243,235,.86);
  --accent:#FF6B4A; --accent-text:#fff; --accent-soft:rgba(255,107,74,.13); --accent-glow:rgba(255,107,74,.35);
  --good:#2F9E5B; --warn:#DB8F12; --bad:#E5484D;
  --p:#4C7EF3; --f:#E39B12; --c:#2F9E5B; --k:#FF6B4A;
  --shadow:0 10px 30px rgba(60,64,40,.10);
  --blob1:#B6D9A2; --blob2:#FFB59E; --blob3:#FFE08A;
  --font:'Onest',-apple-system,BlinkMacSystemFont,'SF Pro Text',Roboto,'Segoe UI',sans-serif;
  --display:'Unbounded','Onest',-apple-system,BlinkMacSystemFont,sans-serif;
}
html.dark{
  --bg:#0E1511; --text:#EEF2EA; --hint:#93A094;
  --glass:rgba(255,255,255,.075); --glass-2:rgba(255,255,255,.025); --glass-border:rgba(255,255,255,.14); --glass-hl:rgba(255,255,255,.22);
  --fill:rgba(255,255,255,.07); --line:rgba(255,255,255,.08); --seg-on:rgba(255,255,255,.16);
  --sheet:rgba(18,26,21,.86);
  --accent-soft:rgba(255,107,74,.2);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --blob1:#1D5A39; --blob2:#6E2A1A; --blob3:#5E4712;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;color:var(--text);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-synthesis:none;overscroll-behavior-y:none}
main{padding:calc(16px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1{font:700 21px/1.2 var(--display);letter-spacing:-.01em;margin:6px 0 6px}
h2{font:700 16px/1.3 var(--font);margin:24px 0 10px;letter-spacing:-.005em}
.hint{color:var(--hint);font-size:13.5px}

/* фон с пятнами — под стеклом */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg);pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(64px);opacity:.8;animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(1){width:70vw;height:70vw;max-width:420px;max-height:420px;background:var(--blob1);top:-12vw;left:-18vw}
.bg i:nth-child(2){width:60vw;height:60vw;max-width:380px;max-height:380px;background:var(--blob2);top:35vh;right:-22vw;animation-delay:-7s}
.bg i:nth-child(3){width:55vw;height:55vw;max-width:340px;max-height:340px;background:var(--blob3);bottom:-10vh;left:-10vw;animation-delay:-14s}
@keyframes drift{to{transform:translate(6vw,4vh) scale(1.08)}}

/* liquid glass */
.glass,.card,nav,.toast{
  background:linear-gradient(145deg,var(--glass),var(--glass-2));
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--glass-border);
  box-shadow:inset 0 1px 0 var(--glass-hl),inset 0 -1px 1px rgba(255,255,255,.08),var(--shadow);
}
.card{border-radius:22px;padding:14px;margin:10px 0;position:relative}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--hint);margin-bottom:5px;font-weight:500}
input,select{width:100%;padding:12px 13px;border-radius:14px;border:1px solid var(--line);background:var(--fill);color:var(--text);font:500 16px var(--font);outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--hint) 50%),linear-gradient(135deg,var(--hint) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:18px;background:linear-gradient(180deg,#FF8063,var(--accent));color:var(--accent-text);font:600 16px var(--font);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px var(--accent-glow);transition:transform .15s}
.btn:active,.chip:active,.goal:active,.rc:active,nav button:active{transform:scale(.97)}
.btn.ghost{background:var(--fill);color:var(--text);box-shadow:inset 0 1px 0 var(--glass-hl)}
.btn.small{display:inline-block;width:auto;padding:9px 15px;font-size:14px;border-radius:14px}
.seg{display:flex;background:var(--fill);border-radius:14px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--hint);padding:9px;border-radius:11px;font:500 15px var(--font);cursor:pointer;transition:all .2s}
.seg button.on{background:var(--seg-on);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--fill);color:var(--text);border-radius:999px;padding:7px 13px;font:500 14px var(--font);cursor:pointer;user-select:none;transition:transform .15s,background .2s}
.chip.on{background:var(--accent);border-color:transparent;color:var(--accent-text);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 12px var(--accent-glow)}
.chip.miss{background:rgba(227,155,18,.13);border-color:rgba(227,155,18,.35);color:var(--warn);cursor:default}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goal{background:var(--fill);border:1.5px solid transparent;border-radius:18px;padding:12px;cursor:pointer;transition:all .2s}
.goal.on{border-color:var(--accent);background:var(--accent-soft)}
.goal b{display:block;font-size:15px;font-weight:600}.goal span{font-size:12px;color:var(--hint)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stat div{background:var(--fill);border-radius:16px;padding:10px 4px}
.stat b{display:block;font:700 17px var(--display)}.stat span{font-size:11px;color:var(--hint)}
.bar{height:8px;background:var(--fill);border-radius:99px;overflow:hidden;margin:5px 0 11px}
.bar i{display:block;height:100%;border-radius:99px}
.rc{display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:transform .15s}
.rc .em{font-size:28px;width:50px;height:50px;display:grid;place-items:center;background:var(--fill);border-radius:16px;flex:none}
.rc .nm{font-weight:600;font-size:15.5px}
.macro{font-size:12.5px;color:var(--hint);margin-top:3px}
.macro b{font-weight:700}
.k{color:var(--k)}.p{color:var(--p)}.f{color:var(--f)}.c{color:var(--c)}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--fill);color:var(--hint);margin:5px 4px 0 0}
.empty{text-align:center;color:var(--hint);padding:18px 8px}

/* плавающее стеклянное меню */
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;display:flex;border-radius:28px;padding:6px;z-index:10}
nav button{flex:1;border:0;background:none;color:var(--hint);font:500 10.5px var(--font);padding:5px 0 4px;cursor:pointer;border-radius:22px;transition:all .2s}
nav button i{display:block;font-style:normal;font-size:21px;line-height:1.25}
nav button.on{color:var(--accent);background:var(--accent-soft);font-weight:600}

.verdict{border-radius:16px;padding:12px;margin:8px 0;font-size:14px}
.verdict.good{background:rgba(47,158,91,.12);border:1px solid rgba(47,158,91,.3)}
.verdict.warn{background:rgba(227,155,18,.12);border:1px solid rgba(227,155,18,.32)}
.verdict.bad{background:rgba(229,72,77,.11);border:1px solid rgba(229,72,77,.3)}
.rules li{margin:7px 0}

/* шторка рецепта */
.ov{position:fixed;inset:0;background:rgba(10,16,12,.35);z-index:20;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-top:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hl);width:100%;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.9,.3,1)}
.sheet::before{content:"";display:block;width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.x{float:right;border:0;background:var(--fill);color:var(--text);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
ol.steps{padding-left:20px}ol.steps li{margin:7px 0}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(60px);opacity:.3}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);color:var(--text);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:500;z-index:30;animation:fade .2s;white-space:nowrap}

/* хрустальный шар */
.stage{color-scheme:dark;position:relative;isolation:isolate;border-radius:32px;padding:26px 16px 22px;text-align:center;overflow:hidden;color:#F4F0FF;
  background:radial-gradient(120% 85% at 50% 10%,#1f1450 0%,#0f0a2e 48%,#05040f 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.05),0 20px 50px rgba(20,8,50,.45)}
.stage>*{position:relative;z-index:2}
.stage .nebula,.stage .fx{position:absolute;z-index:0;pointer-events:none}
.nebula{inset:-20%}
.nebula::before,.nebula::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.28;animation:neb 18s ease-in-out infinite alternate}
.nebula::before{width:60%;height:45%;left:-5%;top:30%;background:#5b21b6}
.nebula::after{width:55%;height:40%;right:-5%;top:12%;background:#155e75;animation-delay:-9s;opacity:.22}
@keyframes neb{to{transform:translate(8%,-6%) scale(1.15)}}
.fx{inset:0;z-index:1}
.stage .ttl{font:700 22px/1.2 var(--display);letter-spacing:-.01em;background:linear-gradient(180deg,#fff 30%,#c9b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.stage .sub{font-size:14px;color:rgba(226,216,255,.7);margin-top:4px}
.stage .hint{color:rgba(226,216,255,.62)}

/* сцена: пол, подставка, шар */
.scene{position:relative;width:260px;height:292px;margin:6px auto 0;cursor:pointer;--tx:0;--ty:0}
.floor{position:absolute;left:50%;bottom:4px;width:250px;height:54px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(150,130,255,.32),rgba(150,130,255,0));filter:blur(8px);animation:floor 5s ease-in-out infinite}
.floor::after{content:"";position:absolute;left:25%;right:25%;top:30%;bottom:30%;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(6px)}
@keyframes floor{50%{transform:translateX(-50%) scale(.92);opacity:.8}}
.ped{position:absolute;left:50%;bottom:22px;width:150px;height:70px;transform:translateX(-50%)}
.ped-body{position:absolute;inset:14px 0 0 0;clip-path:polygon(12% 0,88% 0,100% 82%,0 82%);
  background:linear-gradient(90deg,#0b0805,#2a2016 14%,#5a4630 32%,#8a7352 41%,#4a3a26 56%,#211910 78%,#0b0805)}
.ped-body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;border-radius:50%;background:linear-gradient(90deg,#070504,#231a10 20%,#4d3c28 42%,#231a10 70%,#070504)}
.ped-rim,.ped-front{position:absolute;left:50%;top:0;width:132px;height:30px;transform:translateX(-50%);border-radius:50%;
  background:linear-gradient(90deg,#120d08,#3a2d1d 18%,#9a8160 40%,#6b5638 55%,#2a2016 82%,#0d0906)}
.ped-rim{box-shadow:inset 0 -8px 12px rgba(0,0,0,.55)}
.ped-rim::after{content:"";position:absolute;inset:4px 10px;border-radius:50%;background:radial-gradient(closest-side,rgba(190,175,255,.55),rgba(110,80,220,.15) 70%,transparent);mix-blend-mode:screen}
.ped-front{z-index:4;clip-path:inset(50% 0 0 0);box-shadow:inset 0 2px 2px rgba(220,200,170,.35),0 6px 10px rgba(0,0,0,.45)}

.tilt{position:absolute;left:50%;top:14px;width:208px;height:208px;margin-left:-104px;z-index:3;
  transform:perspective(700px) rotateY(calc(var(--tx)*9deg)) rotateX(calc(var(--ty)*-9deg));transition:transform .25s ease-out}
.bob{width:100%;height:100%;animation:bob 5s ease-in-out infinite;filter:drop-shadow(0 0 24px rgba(130,105,255,.42)) drop-shadow(0 0 70px rgba(90,60,200,.22));transition:filter .4s}
@keyframes bob{50%{transform:translateY(-7px)}}
.orb{width:100%;height:100%;border-radius:50%;position:relative;overflow:hidden;clip-path:circle(50%);isolation:isolate;
  background:radial-gradient(circle at 50% 62%,#2d1a73 0%,#170c45 48%,#0a0526 78%,#030110 100%)}
.smokecv{position:absolute;inset:-3%;width:106%;height:106%;z-index:1;filter:blur(1.5px);transform:translate(calc(var(--tx)*6px),calc(var(--ty)*6px))}
@keyframes swirl{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.18);opacity:.75}}
.orb .in{position:absolute;inset:0;display:grid;place-items:center;font-size:66px;z-index:2;filter:drop-shadow(0 0 14px rgba(255,255,255,.55));transition:opacity .35s,transform .35s,filter .35s}
.orb .in.q{font:300 62px var(--display);color:rgba(255,255,255,.82);text-shadow:0 0 24px rgba(216,180,254,.9)}
.orb .in.reveal{animation:emerge .9s cubic-bezier(.2,.9,.25,1.2) both}
@keyframes emerge{from{opacity:0;transform:scale(.3);filter:blur(12px) drop-shadow(0 0 30px #fff)}}
/* стекло: френелевский ободок и блики */
.rim{position:absolute;inset:0;border-radius:50%;z-index:3;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 0 22px rgba(216,200,255,.45),inset -24px -32px 50px rgba(0,0,0,.7),inset 16px 12px 30px rgba(255,255,255,.14)}
.spec{position:absolute;z-index:4;left:15%;top:8%;width:40%;height:24%;border-radius:50%;background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.95),rgba(255,255,255,.25) 45%,transparent 70%);
  transform:translate(calc(var(--tx)*-10px),calc(var(--ty)*-8px)) rotate(-28deg)}
.spec2{position:absolute;z-index:4;inset:6%;border-radius:50%;border:2px solid transparent;border-bottom-color:rgba(255,255,255,.32);border-right-color:rgba(255,255,255,.12);filter:blur(.6px);
  transform:translate(calc(var(--tx)*-4px),calc(var(--ty)*-4px)) rotate(22deg)}
.dot{position:absolute;z-index:4;right:22%;bottom:16%;width:7%;height:5%;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(1px)}
.flash{position:absolute;inset:0;z-index:5;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 65%);opacity:0;pointer-events:none}

/* гадание */
.scene.casting .tilt{animation:quake .45s ease-in-out 3}
.scene.casting .bob{filter:drop-shadow(0 0 40px rgba(205,190,255,.75)) drop-shadow(0 0 90px rgba(120,90,255,.55))}
.scene.casting .in{opacity:0;transform:scale(.4);filter:blur(8px)}
.scene.casting .flash{animation:flash 1.5s ease-in forwards}
.scene.casting .floor{animation:none;opacity:1;transform:translateX(-50%) scale(1.15)}
@keyframes quake{0%,100%{transform:perspective(700px) rotate(0)}25%{transform:perspective(700px) translate(-5px,2px) rotate(-3deg)}75%{transform:perspective(700px) translate(5px,-2px) rotate(3deg)}}
@keyframes flash{0%,70%{opacity:0}90%{opacity:.9}100%{opacity:0}}

/* искры */
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:tw 2.6s infinite}
.mote{position:absolute;bottom:-6px;width:3px;height:3px;border-radius:50%;background:#e4dcff;box-shadow:0 0 8px 1px rgba(200,185,255,.8);animation:rise linear infinite;opacity:0}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@keyframes rise{10%{opacity:.9}80%{opacity:.6}100%{opacity:0;transform:translate(var(--dx,10px),-420px)}}

/* предсказание */
.prophecy{margin-top:16px;padding:16px 14px;border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:prophecy .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes prophecy{from{opacity:0;transform:translateY(14px);filter:blur(8px)}}
.prophecy .say{font:600 11px/1.4 var(--font);letter-spacing:.14em;text-transform:uppercase;color:#c9b8ff}
.prophecy .rname{font:700 19px/1.25 var(--display);margin:8px 0 6px;color:#fff}
.stage .macro{color:rgba(226,216,255,.7)}
.stage .btn:not(.ghost){background:linear-gradient(180deg,#a17bff,#7c3aed);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 22px rgba(124,58,237,.5)}
.stage .btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.idle-hint{margin-top:14px;font-size:13px;color:rgba(226,216,255,.6)}

/* Android: стекло дороже по производительности — чуть меньше размытия */
html.pf-android .card,html.pf-android nav{-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
@media (prefers-reduced-motion:reduce){.bg i,.bob,.mote,.nebula::before,.nebula::after,.floor{animation:none}}
</style>
</head>

<div class="bg"><i></i><i></i><i></i></div>
<main id="app"></main>
<nav id="nav"></nav>

<script>
/* ================== DATA ================== */
// g — группа для правил сочетаемости: P белок, S крахмал/крупы, V овощи (нейтральные), F жиры,
// D кисломолочка, M молоко, FS кислые фрукты/ягоды, FW сладкие фрукты. u — раздел в «холодильнике». pk — вид белка.
const ING = {
  chicken:{n:'Куриное филе',e:'🍗',g:'P',u:'meat',pk:'мясо'},
  beef:{n:'Говядина',e:'🥩',g:'P',u:'meat',pk:'мясо'},
  turkey:{n:'Индейка',e:'🦃',g:'P',u:'meat',pk:'мясо'},
  fish:{n:'Белая рыба',e:'🐟',g:'P',u:'fish',pk:'рыба'},
  salmon:{n:'Лосось',e:'🐠',g:'P',u:'fish',pk:'рыба'},
  shrimp:{n:'Креветки',e:'🍤',g:'P',u:'fish',pk:'рыба'},
  eggs:{n:'Яйца',e:'🥚',g:'P',u:'dairy',pk:'яйца'},
  cottage:{n:'Творог',e:'🧀',g:'P',u:'dairy',pk:'молочный белок'},
  cheese:{n:'Сыр / фета',e:'🧀',g:'P',u:'dairy',pk:'молочный белок'},
  yogurt:{n:'Греческий йогурт',e:'🥛',g:'D',u:'dairy'},
  kefir:{n:'Кефир',e:'🥛',g:'D',u:'dairy'},
  milk:{n:'Молоко',e:'🥛',g:'M',u:'dairy'},
  tofu:{n:'Тофу',e:'⬜',g:'P',u:'legume',pk:'растительный белок'},
  lentils:{n:'Чечевица',e:'🫘',g:'S',u:'legume'},
  chickpeas:{n:'Нут',e:'🫘',g:'S',u:'legume'},
  buckwheat:{n:'Гречка',e:'🌾',g:'S',u:'starch'},
  rice:{n:'Рис',e:'🍚',g:'S',u:'starch'},
  oats:{n:'Овсянка',e:'🥣',g:'S',u:'starch'},
  quinoa:{n:'Киноа',e:'🌾',g:'S',u:'starch'},
  pasta:{n:'Цельнозерновая паста',e:'🍝',g:'S',u:'starch'},
  potato:{n:'Картофель',e:'🥔',g:'S',u:'starch'},
  bread:{n:'Цельнозерновой хлеб',e:'🍞',g:'S',u:'starch'},
  broccoli:{n:'Брокколи',e:'🥦',g:'V',u:'veg'},
  cauliflower:{n:'Цветная капуста',e:'🥦',g:'V',u:'veg'},
  zucchini:{n:'Кабачок',e:'🥒',g:'V',u:'veg'},
  eggplant:{n:'Баклажан',e:'🍆',g:'V',u:'veg'},

function calcNorm(p){
  const g = GOALS[p.goal];
  const bmr = 10*p.weight + 6.25*p.height - 5*p.age + (p.sex==='m'?5:-161);
  const tdee = bmr*p.act;
  const kcal = Math.round(tdee*g.kc/10)*10;
  const prot = Math.round(p.weight*g.pk);
  const fat = Math.round(p.weight*g.fk);
  const carb = Math.max(50, Math.round((kcal - prot*4 - fat*9)/4));
  const bmi = p.weight/((p.height/100)**2);
  return {bmr:Math.round(bmr), tdee:Math.round(tdee), kcal, prot, fat, carb, water:(p.weight*0.03).toFixed(1), bmi:bmi.toFixed(1)};
}

function compat(ids){
  const items = ids.map(id=>({id,...ING[id]}));
  const by = g => items.filter(i=>i.g===g);
  const names = arr => arr.map(i=>i.n.toLowerCase()).join(', ');
  const P=by('P'),Sx=by('S'),V=by('V'),F=by('F'),D=by('D'),M=by('M'),FS=by('FS'),FW=by('FW');
  const issues=[];
  if(P.length && Sx.length) issues.push({l:'bad',t:`Белок (${names(P)}) + крахмал (${names(Sx)}). Для белка желудку нужна кислая среда, для крахмала щелочная, поэтому переваривание замедляется и появляется тяжесть. Ешь белок с овощами, а крупы отдельно.`});
  const kinds=[...new Set(P.map(i=>i.pk))];
  if(kinds.length>1) issues.push({l:'warn',t:`Разные виды белка за один приём (${kinds.join(', ')}). Лучше один источник белка на тарелке.`});
  if(FW.length && items.some(i=>!['FW','F'].includes(i.g))) issues.push({l:'bad',t:`Сладкие фрукты (${names(FW)}) лучше есть отдельно: за 30 минут до еды или через 2 часа после. С другой едой они бродят.`});
  if(FS.length && (P.length||Sx.length)) issues.push({l:'warn',t:`Кислые фрукты и ягоды (${names(FS)}) мешают переваривать белок и крахмал. Подойдут с кисломолочкой, орехами или как отдельный перекус.`});
  const hardP=P.filter(i=>i.pk!=='молочный белок');
  if(D.length && hardP.length) issues.push({l:'bad',t:`Кисломолочное (${names(D)}) плохо сочетается с мясом, рыбой, яйцами и тофу.`});
  else if(D.length && Sx.length) issues.push({l:'warn',t:`Кисломолочное + крахмал — терпимо, но не лучший вариант.`});
  if(M.length && items.length>1) issues.push({l:'warn',t:`Молоко — отдельная еда. Его лучше пить отдельно от других продуктов.`});
  let level='good';
  if(issues.some(i=>i.l==='warn')) level='warn';
  if(issues.some(i=>i.l==='bad')) level='bad';
  let good='';
  if(level==='good'){
    if(P.length && V.length) good='Белок + овощи — идеальная пара. Клетчатка помогает белку усвоиться.';
    else if(Sx.length && V.length) good='Крахмал + овощи — отличное сочетание для энергии без тяжести.';
    else if(D.length && FS.length) good='Кисломолочка + кислые ягоды — хорошая пара для лёгкого перекуса.';
    else if(F.length && (FS.length||FW.length)) good='Фрукты + орехи — хороший энергетический перекус.';
    else if(V.length && !P.length && !Sx.length) good='Овощи нейтральны и сочетаются почти со всем.';
    else good='Хорошее сочетание.';
  }
  return {level,issues,good};
}

function dietOk(r,diet){
  const gs = r.ing.map(i=>ING[i]);
  const animal = gs.some(i=>i.u==='meat'||i.u==='fish');
  const dairyEgg = r.ing.some(i=>['eggs','cottage','cheese','yogurt','kefir','milk'].includes(i));
  switch(diet){
    case 'protein': return r.p>=20;
    case 'lowcarb': return r.c<=20;
    case 'veg': return !animal;
    case 'vegan': return !animal && !dairyEgg;
    default: return true;
  }
}
function goalScore(r,goal){
  const hasS = r.ing.some(i=>ING[i].g==='S');
  switch(goal){
    case 'lose': return (r.p*4/r.k)*100 - Math.max(0,r.k-400)/8;
    case 'gain': return r.k/10 + r.p/2;
    case 'energy': return r.c/2 + (hasS?15:0) + r.p/4;
    default: return 20 + Math.min(r.p,30)/2;
  }
}
const missing = r => r.ing.filter(i=>!S.fridge.has(i));
const prof = () => S.profile || {goal:'keep',diet:'balanced'};
function pool(meal){
  const p = prof();
  return RECIPES.filter(r=>dietOk(r,p.diet) && (meal==='all'||r.m.includes(meal)))
    .sort((a,b)=>goalScore(b,p.goal)-goalScore(a,p.goal));
}

  const h=new Date().getHours();
  return h<11?'breakfast':h<16?'lunch':h<18?'snack':'dinner';
}

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
const macro = r => `<span class="k"><b>${r.k}</b> ккал</span> · <span class="p">Б ${r.p}</span> · <span class="f">Ж ${r.f}</span> · <span class="c">У ${r.c}</span> · ⏱ ${r.t} мин`;
function recipeCard(r, showMiss=true){
  const miss = missing(r);
  return `<div class="card rc" data-r="${r.id}">
    <div class="em">${r.e}</div>
    <div style="flex:1">
      <div class="nm">${r.n}</div>
      <div class="macro">${macro(r)}</div>
      ${showMiss && miss.length && miss.length<r.ing.length ? `<div style="margin-top:6px" class="chips">${miss.map(i=>`<span class="chip miss" style="padding:3px 9px;font-size:12px">+ ${ING[i].n}</span>`).join('')}</div>`:''}
      <div>${r.m.map(m=>`<span class="tag">${MEALS[m]}</span>`).join('')}</div>
    </div></div>`;
}

/* ================== TABS ================== */
const TABS = [
  ['ball','🔮','Шар'],['fridge','🧊','Продукты'],['recipes','🍽','Рецепты'],['compat','⚖️','Сочетания'],['profile','👤','Профиль'],
];
function renderNav(){
  $('#nav').innerHTML = TABS.map(([id,ic,t])=>`<button data-tab="${id}" class="${S.tab===id?'on':''}"><i>${ic}</i>${t}</button>`).join('');
}
function go(tab){ S.tab=tab; renderNav(); render(); window.scrollTo(0,0); }

function render(){
  const v = {ball:vBall,fridge:vFridge,recipes:vRecipes,compat:vCompat,profile:vProfile}[S.tab]();
  $('#app').innerHTML = v;
  if(S.tab==='ball') sparkles();
}

/* ---------- PROFILE ---------- */
function vProfile(){
  const p = S.profile || {sex:'f',age:28,height:168,weight:62,act:1.375,goal:'keep',diet:'balanced'};
  const n = S.profile ? calcNorm(S.profile) : null;
  const eaten = S.log.items.reduce((a,i)=>({k:a.k+i.k,p:a.p+i.p,f:a.f+i.f,c:a.c+i.c}),{k:0,p:0,f:0,c:0});
  const bar=(v,max,col)=>`<div class="bar"><i style="width:${Math.min(100,v/max*100)}%;background:${col}"></i></div>`;
  return `
  <h1>${S.profile?'Твоя норма КБЖУ':'Давай познакомимся'}</h1>
  <div class="hint">Посчитаем суточную норму калорий, белков, жиров и углеводов по формуле Миффлина — Сан Жеора.</div>
  ${n?`
  <div class="card">
    <div class="stat">
      <div><b class="k">${n.kcal}</b><span>ккал</span></div>
      <div><b class="p">${n.prot}</b><span>белки, г</span></div>
      <div><b class="f">${n.fat}</b><span>жиры, г</span></div>
      <div><b class="c">${n.carb}</b><span>углев., г</span></div>
    </div>
    <div class="hint" style="margin-top:10px">Базовый обмен: ${n.bmr} ккал · С учётом активности: ${n.tdee} ккал · Вода: ~${n.water} л · ИМТ: ${n.bmi}</div>
  </div>
  <h2>Сегодня съедено</h2>
  <div class="card">
    <div class="row" style="justify-content:space-between"><span>Калории</span><span class="hint">${eaten.k} / ${n.kcal}</span></div>${bar(eaten.k,n.kcal,'var(--k)')}
    <div class="row" style="justify-content:space-between"><span>Белки</span><span class="hint">${eaten.p} / ${n.prot} г</span></div>${bar(eaten.p,n.prot,'var(--p)')}
    <div class="row" style="justify-content:space-between"><span>Жиры</span><span class="hint">${eaten.f} / ${n.fat} г</span></div>${bar(eaten.f,n.fat,'var(--f)')}
    <div class="row" style="justify-content:space-between"><span>Углеводы</span><span class="hint">${eaten.c} / ${n.carb} г</span></div>${bar(eaten.c,n.carb,'var(--c)')}
    ${S.log.items.length?`<div class="hint">${S.log.items.map(i=>RECIPES.find(r=>r.id===i.id)?.n).join(' · ')}</div>
      <button class="btn ghost small" style="margin-top:8px" onclick="S.log.items=[];save();render()">Сбросить день</button>`
      :`<div class="hint">Открой рецепт и нажми «Я это съел(а)», чтобы блюдо попало в дневник.</div>`}
  </div>`:''}
  <h2>Параметры</h2>
  <div class="card">
    <div class="seg" style="margin-bottom:12px">
      <button class="${p.sex==='f'?'on':''}" onclick="setSex('f')">Женщина</button>
      <button class="${p.sex==='m'?'on':''}" onclick="setSex('m')">Мужчина</button>
    </div>
    <div class="grid2" style="grid-template-columns:1fr 1fr 1fr">
      <div><label>Возраст</label><input id="age" type="number" inputmode="numeric" value="${p.age}"></div>
      <div><label>Рост, см</label><input id="height" type="number" inputmode="numeric" value="${p.height}"></div>
      <div><label>Вес, кг</label><input id="weight" type="number" inputmode="decimal" value="${p.weight}"></div>
    </div>
    <div style="margin-top:10px"><label>Активность</label>
      <select id="act">${ACT.map(([v,t])=>`<option value="${v}" ${+p.act===v?'selected':''}>${t}</option>`).join('')}</select></div>
  </div>
  <h2>Чего хочешь от питания?</h2>
  <div class="goals">${Object.entries(GOALS).map(([k,g])=>`<div class="goal ${p.goal===k?'on':''}" onclick="pick('goal','${k}',this)"><b>${g.e} ${g.n}</b><span>${g.d}</span></div>`).join('')}</div>
  <h2>Тип питания</h2>
  <div class="chips" id="diets">${Object.entries(DIETS).map(([k,t])=>`<span class="chip ${p.diet===k?'on':''}" onclick="pick('diet','${k}',this)">${t}</span>`).join('')}</div>
  <div class="hint" style="margin-top:8px">Все рецепты составлены по правилам раздельного питания: белок с овощами, крупы с овощами, фрукты отдельно.</div>
  <div style="margin-top:18px"><button class="btn" onclick="saveProfile()">${S.profile?'Пересчитать':'Рассчитать норму'}</button></div>`;
}
let draft = null;
function getDraft(){ if(!draft) draft = {...(S.profile||{sex:'f',goal:'keep',diet:'balanced'})}; return draft; }
function setSex(s){ getDraft().sex=s; document.querySelectorAll('.seg button').forEach((b,i)=>b.classList.toggle('on',(i===0)===(s==='f'))); haptic(); }
function pick(field,val,el){
  getDraft()[field]=val;
  el.parentNode.querySelectorAll('.on').forEach(x=>x.classList.remove('on')); el.classList.add('on'); haptic();
}
function saveProfile(){
  const d = getDraft();
  const age=+$('#age').value, height=+$('#height').value, weight=+$('#weight').value;
  if(!(age>=12&&age<=100&&height>=120&&height<=230&&weight>=30&&weight<=300)){ toast('Проверь возраст, рост и вес'); return; }
  S.profile = {sex:d.sex||'f',age,height,weight,act:+$('#act').value,goal:d.goal||'keep',diet:d.diet||'balanced'};
  draft=null; save(); haptic('medium'); toast('Норма рассчитана ✨'); render();
}

  return `

  <div class="hint">Отметь продукты, которые у тебя есть, и я подберу рецепты. Соль, специи и немного масла для жарки считаются по умолчанию.</div>
  <div class="row" style="margin-top:12px">
    <input id="q" placeholder="🔍 Поиск продукта" value="${S.q.replace(/"/g,'&quot;')}" oninput="S.q=this.value;renderFridgeList()">
    ${S.fridge.size?`<button class="btn ghost small" onclick="S.fridge.clear();save();render()">Очистить</button>`:''}
  </div>
  <div class="hint" style="margin-top:8px">Выбрано: <b id="cnt">${S.fridge.size}</b></div>
  <div id="flist">${fridgeList(q)}</div>
  ${S.shop.length?`<h2>🛒 Список покупок</h2>
  <div class="card"><div class="chips">${S.shop.map(i=>`<span class="chip" onclick="bought('${i}')">${ING[i].e} ${ING[i].n} ✓</span>`).join('')}</div>
  <div class="hint" style="margin-top:8px">Нажми на продукт, когда купишь, и он переедет в холодильник.</div>
  <button class="btn ghost small" style="margin-top:8px" onclick="S.shop=[];save();render()">Очистить список</button></div>`:''}
  <div style="margin-top:18px"><button class="btn" onclick="go('recipes')">Показать, что приготовить →</button></div>`;
}
function fridgeList(q){
  return SECTIONS.map(([u,t])=>{
    const ids = Object.keys(ING).filter(i=>ING[i].u===u && (!q || ING[i].n.toLowerCase().includes(q)));
    if(!ids.length) return '';
    return `<h2>${t}</h2><div class="chips">${ids.map(i=>`<span class="chip ${S.fridge.has(i)?'on':''}" data-ing="${i}">${ING[i].e} ${ING[i].n}</span>`).join('')}</div>`;
  }).join('') || '<div class="empty">Ничего не нашлось</div>';
}
function renderFridgeList(){ $('#flist').innerHTML = fridgeList(S.q.trim().toLowerCase()); }
function bought(i){ S.shop=S.shop.filter(x=>x!==i); S.fridge.add(i); save(); haptic(); render(); }

  const list = pool(S.meal);
  const now = list.filter(r=>missing(r).length===0);
  const soon = list.filter(r=>{const m=missing(r).length;return m>0&&m<=2&&m<r.ing.length});
  const p=prof();
  return `
  <h1>Что приготовить</h1>
  <div class="hint">${GOALS[p.goal].e} ${GOALS[p.goal].n} · ${DIETS[p.diet]}${S.profile?'':' · <a style="color:var(--accent)" onclick="go(\'profile\')">настроить профиль</a>'}</div>
  <div class="chips" style="margin-top:12px">
    ${[['all','Все'],...Object.entries(MEALS)].map(([k,t])=>`<span class="chip ${S.meal===k?'on':''}" onclick="S.meal='${k}';render()">${t}</span>`).join('')}
  </div>
  ${!S.fridge.size?`<div class="card empty">🧊 Холодильник пока пуст.<br><br><button class="btn small" onclick="go('fridge')">Отметить продукты</button></div>
     <h2>Подходят под твою цель</h2>${list.slice(0,10).map(r=>recipeCard(r,false)).join('')}`:`

  ${now.length?now.map(r=>recipeCard(r)).join(''):'<div class="card empty">Из того, что есть, полноценного блюда пока не получается. Загляни в список ниже 👇</div>'}

function openRecipe(id){
  const r = RECIPES.find(x=>x.id===id); if(!r) return;
  const n = S.profile?calcNorm(S.profile):null;
  const miss = missing(r);
  const cp = compat(r.ing);
  const pct = n?Math.round(r.k/n.kcal*100):null;
  const ov = document.createElement('div'); ov.className='ov';
  ov.innerHTML = `<div class="sheet">
    <button class="x" onclick="closeModal()">✕</button>
    <div style="font-size:44px">${r.e}</div>
    <h1>${r.n}</h1>
    <div class="macro" style="font-size:14px">${macro(r)}</div>
    ${n?`<div class="hint" style="margin-top:4px">Это ${pct}% твоей дневной нормы калорий и ${Math.round(r.p/n.prot*100)}% нормы белка</div>`:''}
    <div class="verdict good">🟢 ${cp.good}</div>
    <h2>Ингредиенты</h2>
    <div class="chips">${r.ing.map(i=>`<span class="chip ${S.fridge.has(i)?'on':'miss'}">${S.fridge.has(i)?'✓':'+'} ${ING[i].e} ${ING[i].n}</span>`).join('')}
      ${r.opt.map(i=>`<span class="chip" style="opacity:.7">${ING[i].e} ${ING[i].n} (по желанию)</span>`).join('')}</div>
    <h2>Как готовить</h2>
    <ol class="steps">${r.s.map(s=>`<li>${s}</li>`).join('')}</ol>
    <div style="display:grid;gap:8px;margin-top:16px">
      <button class="btn" onclick="ate('${r.id}')">Я это съел(а) ✓</button>
      ${miss.length?`<button class="btn ghost" onclick="toShop('${r.id}')">🛒 Добавить в покупки: ${miss.map(i=>ING[i].n.toLowerCase()).join(', ')}</button>`:''}
    </div></div>`;
  ov.addEventListener('click',e=>{ if(e.target===ov) closeModal(); });
  document.body.appendChild(ov);
  try{ tg && tg.BackButton.show(); }catch(e){}
  haptic();
}
function closeModal(){ document.querySelectorAll('.ov').forEach(o=>o.remove()); try{ tg && tg.BackButton.hide(); }catch(e){} }
function ate(id){
  const r=RECIPES.find(x=>x.id===id); S.log.items.push({id,k:r.k,p:r.p,f:r.f,c:r.c}); save();
  try{ tg && tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
  closeModal(); toast('Добавлено в дневник 🍽'); if(S.tab==='profile') render();
}
function toShop(id){
  const r=RECIPES.find(x=>x.id===id); missing(r).forEach(i=>{ if(!S.shop.includes(i)) S.shop.push(i); }); save();
  closeModal(); toast('Добавлено в список покупок 🛒');
}

function sparkles(){
  const fx=$('#fx'); if(!fx) return;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  for(let i=0;i<22;i++){ const s=document.createElement('span'); s.className='star';
    s.style.cssText=`left:${rnd(0,100)}%;top:${rnd(0,70)}%;animation-delay:${rnd(0,2.6)}s;transform:scale(${rnd(.4,1)})`; fx.appendChild(s); }
  for(let i=0;i<14;i++){ const m=document.createElement('span'); m.className='mote';
    m.style.cssText=`left:${rnd(15,85)}%;animation-duration:${rnd(6,11)}s;animation-delay:${rnd(0,8)}s;--dx:${rnd(-30,30)}px`; fx.appendChild(m); }
  initTilt();
  startSmoke();
}

/* дым внутри шара: частицы текут по полю завихрений, узор не повторяется */
let smokeRAF=0;
function startSmoke(){
  cancelAnimationFrame(smokeRAF);
  const cv=document.getElementById('smoke'); if(!cv) return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const W=cv.clientWidth, H=cv.clientHeight; if(!W) return;
  cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const cx=W/2, cy=H/2, R=W/2;
  const PALETTE=[[205,190,255,6],[236,232,255,3],[140,105,255,5],[110,200,225,1],[180,120,235,2]];
  const sprites=PALETTE.flatMap(([r,g,b,w])=>{
    const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d');
    const gr=x.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0,`rgba(${r},${g},${b},1)`); gr.addColorStop(.4,`rgba(${r},${g},${b},.45)`); gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
    x.fillStyle=gr; x.fillRect(0,0,64,64); return Array(w).fill(c);
  });
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const spawn=p=>{ const a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*R*.75;
    Object.assign(p,{x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,vx:0,vy:0,life:0,max:160+Math.random()*240,
      s:R*(.14+Math.random()*.32),img:sprites[(Math.random()*sprites.length)|0],seed:Math.random()*100}); return p; };
  const parts=Array.from({length:72},()=>{const p=spawn({}); p.life=Math.random()*p.max; return p;});
  let boost=1, t=performance.now();
  const step=(dt)=>{
    const casting = !!document.querySelector('#orb.casting');
    boost += ((casting?3.4:1)-boost)*.06;
    t += dt*boost;
    ctx.globalCompositeOperation='destination-out';
    ctx.fillStyle=`rgba(0,0,0,${casting?.07:.04})`; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    for(const p of parts){
      const nx=(p.x-cx)/R, ny=(p.y-cy)/R;
      const ang = Math.sin(nx*2.3 + t*.00034 + p.seed)*2.4
                + Math.cos(ny*2.9 - t*.00027 + p.seed*.3)*2.1
                + Math.sin((nx-ny)*3.7 + t*.00019)*1.6
                + Math.cos((nx+ny)*1.3 - t*.00041)*1.2;
      const f=.014*boost;
      p.vx += Math.cos(ang)*f; p.vy += Math.sin(ang)*f - .0012;
      const dx=p.x-cx, dy=p.y-cy, d=Math.hypot(dx,dy)||1;
      if(d>R*.78){ p.vx -= dx/d*.03; p.vy -= dy/d*.03; }
      p.vx*=.965; p.vy*=.965;
      p.x+=p.vx*boost; p.y+=p.vy*boost;
      p.life+=boost; if(p.life>p.max) spawn(p);
      const k=p.life/p.max;
      ctx.globalAlpha=Math.sin(Math.PI*k)*(casting?.07:.045);
      const s=p.s*(.7+.6*k);
      ctx.drawImage(p.img,p.x-s/2,p.y-s/2,s,s);
    }
    ctx.globalAlpha=1;
  };
  for(let i=0;i<140;i++) step(16);
  let last=performance.now();
  const loop=now=>{
    if(!cv.isConnected) return;
    const dt=Math.min(50,now-last); last=now;
    if(!document.hidden) step(reduce?dt*.3:dt);
    smokeRAF=requestAnimationFrame(loop);
  };
  smokeRAF=requestAnimationFrame(loop);
}

/* объём: шар поворачивается за пальцем и за наклоном телефона */
let tiltBound=false, tiltBase=null;
function setTilt(x,y){
  const sc=$('#orb'); if(!sc) return;
  sc.style.setProperty('--tx',Math.max(-1,Math.min(1,x)).toFixed(3));
  sc.style.setProperty('--ty',Math.max(-1,Math.min(1,y)).toFixed(3));
}
function initTilt(){
  const st=$('#stage'); if(!st) return;
  st.addEventListener('pointermove',e=>{ const r=st.getBoundingClientRect(); setTilt((e.clientX-r.left)/r.width*2-1,(e.clientY-r.top)/r.height*2-1); });
  st.addEventListener('pointerleave',()=>setTilt(0,0));
  if(tiltBound) return; tiltBound=true;
  const onOrient=(beta,gamma)=>{
    if(S.tab!=='ball' || beta==null) return;
    if(!tiltBase) tiltBase={beta,gamma};
    setTilt((gamma-tiltBase.gamma)/25,(beta-tiltBase.beta)/25);
  };
  try{
    if(tg && tg.DeviceOrientation && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')){
      tg.DeviceOrientation.start({refresh_rate:60});
      const deg=v=>v*180/Math.PI;
      tg.onEvent('deviceOrientationChanged',()=>onOrient(deg(tg.DeviceOrientation.beta),deg(tg.DeviceOrientation.gamma)));
      return;
    }
  }catch(e){}
  window.addEventListener('deviceorientation',e=>onOrient(e.beta,e.gamma));
}

let divining=false;
function divine(){
  if(divining) return; divining=true;
  const o=$('#orb'); o.classList.add('casting');
  try{ tg && tg.HapticFeedback.impactOccurred('heavy'); }catch(e){}
  let n=0; const iv=setInterval(()=>{ haptic(n<3?'soft':'medium'); if(++n>5) clearInterval(iv); },220);
  setTimeout(()=>{
    const meal=mealNow();
    let cands = pool(meal); if(!cands.length) cands = pool('all');
    const prev = S.ball && S.ball.id;
    const now = cands.filter(r=>missing(r).length===0);
    const soon = cands.filter(r=>{const m=missing(r).length;return m>0&&m<=2&&m<r.ing.length});
    let tier = now.length?now:soon.length?soon:cands.slice(0,8);
    if(tier.length>1) tier = tier.filter(r=>r.id!==prev);
    const r = tier[Math.floor(Math.random()*tier.length)];
    const miss = missing(r);
    S.ball = {id:r.id, say:PROPHECIES[Math.floor(Math.random()*PROPHECIES.length)],
      note: !S.fridge.size ? 'Подходит под твою цель' : miss.length===0 ? '✅ Всё нужное у тебя уже есть' : `🛒 Нужно докупить: ${miss.map(i=>ING[i].n.toLowerCase()).join(', ')}`};
    S.ballFresh = true;
    try{ tg && tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
    divining=false; render();
  },1500);
}

/* ---------- COMPAT ---------- */
function vCompat(){
  const ids=[...S.compat];
  const res = ids.length>1 ? compat(ids) : null;
  const icon={good:'🟢',warn:'🟡',bad:'🔴'};
  return `
  <h1>Проверка сочетаний</h1>
  <div class="hint">Выбери продукты, которые хочешь съесть вместе, и я скажу, как они усваиваются.</div>
  <div id="cres">${ids.length<2?'<div class="card empty">Выбери хотя бы 2 продукта</div>':
    res.level==='good'?`<div class="verdict good">${icon.good} <b>Отлично сочетается.</b> ${res.good}</div>`:
    res.issues.map(i=>`<div class="verdict ${i.l}">${icon[i.l]} ${i.t}</div>`).join('')}</div>
  ${ids.length?`<button class="btn ghost small" onclick="S.compat.clear();render()">Сбросить выбор</button>`:''}
  ${SECTIONS.map(([u,t])=>`<h2>${t}</h2><div class="chips">${Object.keys(ING).filter(i=>ING[i].u===u).map(i=>`<span class="chip ${S.compat.has(i)?'on':''}" data-cmp="${i}">${ING[i].e} ${ING[i].n}</span>`).join('')}</div>`).join('')}
  <h2>📜 Шпаргалка</h2>
  <div class="card"><ul class="rules" style="padding-left:18px;margin:0">
    <li>🟢 <b>Мясо, рыба, яйца + некрахмалистые овощи</b> — идеально</li>
    <li>🟢 <b>Крупы, картофель, паста + овощи</b> — хорошо</li>
    <li>🔴 <b>Мясо + рис, картофель, макароны</b> — тяжело: белок и крахмал мешают друг другу</li>
    <li>🟡 <b>Один вид белка за приём</b>: не смешивай мясо с яйцами или рыбой</li>
    <li>🔴 <b>Сладкие фрукты отдельно</b>, за 30 минут до еды или через 2 часа после</li>
    <li>🟢 <b>Кисломолочка + ягоды, орехи, зелень</b> — хороший перекус</li>
    <li>🟡 <b>Молоко</b> — отдельный приём пищи</li>
    <li>🟢 <b>Зелень, огурцы, листовые овощи</b> сочетаются почти со всем</li>
  </ul></div>
  <div class="hint" style="margin-top:8px">Правила основаны на принципах раздельного питания. Это не медицинская рекомендация: при заболеваниях ЖКТ посоветуйся с врачом.</div>`;
}

/* ================== EVENTS & INIT ================== */
document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-tab]'); if(nav){ haptic(); go(nav.dataset.tab); return; }
  const rc=e.target.closest('[data-r]'); if(rc){ openRecipe(rc.dataset.r); return; }
  const ing=e.target.closest('[data-ing]');
  if(ing){ const i=ing.dataset.ing; S.fridge.has(i)?S.fridge.delete(i):S.fridge.add(i); ing.classList.toggle('on'); save(); haptic();
    const c=$('#cnt'); if(c) c.textContent=S.fridge.size; return; }
  const cmp=e.target.closest('[data-cmp]');
  if(cmp){ const i=cmp.dataset.cmp; S.compat.has(i)?S.compat.delete(i):S.compat.add(i); haptic(); const y=window.scrollY; render(); window.scrollTo(0,y); }
});

const root=document.documentElement;
function applyTheme(dark){
  root.classList.toggle('dark',dark);
  const bg = dark ? '#0E1511' : '#F3EEE4';
  try{ tg.setHeaderColor(bg); tg.setBackgroundColor(bg); tg.setBottomBarColor && tg.setBottomBarColor(bg); }catch(e){}
}
const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
if(tg){
  try{
    tg.ready(); tg.expand();
    root.classList.add('pf-'+(tg.platform||'web'));
    tg.disableVerticalSwipes && tg.disableVerticalSwipes();
    tg.onEvent('themeChanged',()=>applyTheme(tg.colorScheme==='dark'));
    tg.BackButton.onClick(closeModal);
  }catch(e){}
}
applyTheme(tg && tg.platform && tg.platform!=='unknown' ? tg.colorScheme==='dark' : !!(mq && mq.matches));
if(/Android/i.test(navigator.userAgent)) root.classList.add('pf-android');
S.tab = S.profile ? 'ball' : 'profile';
renderNav(); render();
</script>
